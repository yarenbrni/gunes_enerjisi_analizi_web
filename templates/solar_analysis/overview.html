
{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Sistem Genel Bakışı</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Toplam Panel</h5>
                    <p class="card-text display-4">{{ total_panels }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Toplam Güç</h5>
                    <p class="card-text display-4">{{ total_power }} W</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Ortalama Verimlilik</h5>
                    <p class="card-text display-4">{{ avg_efficiency|floatformat:2 }}%</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
