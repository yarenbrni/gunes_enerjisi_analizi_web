
{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Güneş Enerjisi Analizi</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Konum</label>
            <input type="text" name="location" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Panel Verimliliği (%)</label>
            <input type="number" step="0.01" name="efficiency" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Panel Alanı (m²)</label>
            <input type="number" step="0.01" name="area" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Güneş Radyasyonu (W/m²)</label>
            <input type="number" step="0.01" name="radiation" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Sıcaklık (°C)</label>
            <input type="number" step="0.01" name="temperature" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Analiz Et</button>
    </form>
</div>
{% endblock %}
